[package]
name = "bitbot-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bitbot-protocol = { path = "../bitbot-protocol" }
interprocess = { version = "2", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal"] }

[[bin]]
name = "bitbotd"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
